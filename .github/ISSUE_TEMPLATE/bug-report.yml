name: Bug report
description: An icon renders wrongly, or the package does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: icon
    attributes:
      label: Icon(s)
      description: Leave empty if it is not about a specific icon.
      placeholder: e.g. ki:banana
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      description: Screenshots help a lot for rendering issues.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Framework and versions (Nuxt, @nuxt/icon, Vuetify, @iconify/vue, @iconify/react…), browser or platform.
      placeholder: |
        ki-icons 1.3.0
        Nuxt 4.1, @nuxt/icon 2.0
    validations:
      required: true
